# Todo el sistema con un comando:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-airflow.sh:/docker-entrypoint-initdb.d/init-airflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models_store:/app/models_store

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --firstname Equipo --lastname VitalData --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD}"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      PYTHONPATH: /opt/airflow/src
    depends_on:
      db:
        condition: service_healthy

  airflow-web:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow-env
    volumes: &airflow-vols
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./models_store:/opt/airflow/models_store
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: scheduler
    environment: *airflow-env
    volumes: *airflow-vols
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
